[project]
name = "factfolio"
version = "0.3.0"
description = "FactFolio — open-source, evidence-based portfolio advisory for Indian equity & mutual funds. Every number traceable to a tool call, never a guess."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pankaj Negi" }]
keywords = ["portfolio", "investing", "india", "nse", "bse", "mutual-funds", "claude", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Agent framework
    "claude-agent-sdk>=0.1.0",
    # Data
    "yfinance>=0.2.65",
    "pandas>=2.2",
    "numpy>=2.0",
    "requests>=2.32",
    # Graph theory (louvain_communities ships in networkx>=3.0 — no extra dep,
    # but eigenvector_centrality_numpy imports scipy internally despite the
    # name, so it's a real transitive requirement, not optional)
    "networkx>=3.4",
    "scipy>=1.14",
    # Config / validation
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # Terminal UI: tables, live progress — no GUI, no browser, every platform
    # gets the identical output.
    "rich>=13.9",
    # Standalone MCP server (factfolio mcp) for external clients — VS Code,
    # Claude Desktop, other agents. Already a transitive dep of
    # claude-agent-sdk; declared directly since we import it ourselves now.
    "mcp>=1.2",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "beautifulsoup4>=4.15.0",
]

[project.urls]
# TODO: fill in once the repo is pushed — placeholder to keep this valid TOML.
Homepage = "https://github.com/pankajads/factfolio"
Repository = "https://github.com/pankajads/factfolio"
Issues = "https://github.com/pankajads/factfolio/issues"
Documentation = "https://github.com/pankajads/factfolio/blob/main/docs/USER_GUIDE.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Only needed to build the standalone per-OS executables (release CI, or
# `uv sync --extra build` locally) — not a runtime dependency.
build = [
    "pyinstaller>=6.11",
]

[project.scripts]
# "factfolio" is the project's public name; "mybroker" is kept as an alias
# for the underlying package name (src/mybroker/) — both run the same CLI.
factfolio = "mybroker.ui.cli:main"
mybroker = "mybroker.ui.cli:main"
# Same check as `factfolio validate`, callable standalone (documented in
# README's Usage section) — e.g. in a pre-agent-run gate script.
validate-tickers = "mybroker.tickers_validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mybroker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Network-dependent tests are opt-in: `uv run pytest -m live`
addopts = "-m 'not live'"
markers = [
    "live: hits the network (yfinance/AMFI); deselected by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
